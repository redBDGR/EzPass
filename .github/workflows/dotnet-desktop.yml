# Builds EzPass, a WPF desktop app targeting .NET Framework 4.7.2.
#
# EzPass.csproj is a legacy (non-SDK-style) project using packages.config for its NuGet
# dependencies, so this workflow restores and builds it with classic MSBuild/NuGet rather
# than the `dotnet` CLI (which only understands SDK-style / PackageReference projects).
# There is currently no test project in this repo, so no test step is included - add one
# (and a corresponding `vstest.console.exe` or `dotnet test` step) if/when one is added.

name: Build EzPass

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Path: EzPass.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # packages.config projects are restored with `nuget restore`, not `msbuild /t:Restore`
    # (which only populates PackageReference-based projects).
    - name: Restore NuGet packages
      run: nuget restore $env:Solution_Path

    - name: Build
      run: msbuild $env:Solution_Path /p:Configuration=${{ matrix.configuration }} /p:Platform="Any CPU"

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: EzPass-${{ matrix.configuration }}
        path: bin/${{ matrix.configuration }}/**
